    <script>
document.addEventListener("DOMContentLoaded", async () => {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");
    const container = document.getElementById("articleContent");
    const navContainer = document.getElementById("articleNav");

    if (!slug) {
        container.innerHTML = "<p>No article specified.</p>";
        return;
    }

    try {
        // fetch the single article for display
        const response = await fetch("/.netlify/functions/get-article?slug=" + encodeURIComponent(slug));
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const article = data.article;

        if (!article) {
            container.innerHTML = "<p>Article not found.</p>";
            return;
        }

        document.title = article.title;
        
container.innerHTML = `
<section class="content-main-section" id="articleBody">
    <div class="content-section-article">
        <h1 style="padding-top: .8rem; padding-bottom:0rem">${article.title}</h1>
        <span class="cat">${article.cat}</span>
        <div class="meta-date" style="padding-top: .8rem;">${new Date(article.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
        <div class="article-body">${article.article}</div>
        ${article.file ? `
        <div class="pdf-embed-wrapper">
            <p><a href="${article.file}" target="_blank" rel="noopener">Open PDF in a new tab &rarr;</a></p>
            <iframe src="${article.file}#view=FitH" title="${article.title} PDF" width="90%" height="900" style="border: 5px solid #ced4da; border-radius: 5px;"></iframe>
        </div>
        ` : ''}
    </div>
</section>
`;
        
        const listResponse = await fetch("/.netlify/functions/get-articles");
        if (!listResponse.ok) throw new Error(`HTTP ${listResponse.status}`);

        const listData = await listResponse.json();
        const allArticles = listData["policy_articles"];

        const currentIndex = allArticles.findIndex(a => a.slug === slug);

        const prevArticle = currentIndex > 0 ? allArticles[currentIndex - 1] : null;
        const nextArticle = currentIndex < allArticles.length - 1 ? allArticles[currentIndex + 1] : null;

        navContainer.innerHTML = `
            <div class="article-nav">
                ${prevArticle
                    ? `<a href="policy_articles.html?slug=${encodeURIComponent(prevArticle.slug)}" class="nav-prev">&larr; ${new Date(prevArticle.created_at).toLocaleDateString()}</a>`
                    : `<span class="nav-prev disabled"></span>`
                }
                ${nextArticle
                    ? `<a href="policy_articles.html?slug=${encodeURIComponent(nextArticle.slug)}" class="nav-next">${new Date(nextArticle.created_at).toLocaleDateString()} &rarr;</a>`
                    : `<span class="nav-next disabled"></span>`
                }
            </div>
        `;

    } catch (err) {
        console.error("Failed to load article:", err);
        container.innerHTML = "<p>Something went wrong loading this article.</p>";
    }
});
    </script>

<script>document.addEventListener("click", function (event) {
    const navbarCollapse = document.getElementById("navbarResponsive");
    const toggler = document.querySelector(".navbar-toggler, .navbar-toggler-bio");

    if (!navbarCollapse.classList.contains("show")) return; // menu isn't open, nothing to do

    const clickedInsideMenu = navbarCollapse.contains(event.target);
    const clickedToggler = toggler && toggler.contains(event.target);

    if (!clickedInsideMenu && !clickedToggler) {
        const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
        if (bsCollapse) {
            bsCollapse.hide();
        }
    }
});</script>

<script>const ARTICLES_PAGE = "policy_homepage.html"; // ← change to your articles page's filename
const articlesSection = document.getElementById("danArticlesDisplay");

if (!articlesSection) {
    // ---- Any other page: send the search to the articles page on Enter ----
    searchBar.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            e.preventDefault();
            const query = searchBar.value.trim();
            if (query) {
                window.location.href = `${ARTICLES_PAGE}?q=${encodeURIComponent(query)}`;
            }
        }
    });
} else {
    // ---- Articles page: your existing live search ----
    let hasScrolledToArticles = false;

    searchBar.addEventListener("input", (e) => {
        const rawSearch = e.target.value.toLowerCase();

        if (!hasScrolledToArticles && rawSearch.length > 0) {
            articlesSection.scrollIntoView({ behavior: "smooth" });
            hasScrolledToArticles = true;
        }

        const searchTerms = rawSearch.split(/[;,]/).map(term => term.trim()).filter(Boolean);

        const filteredPosts = policy_articles.filter(post => {
            const catList = post.cat.split(/[;,]/).map(cat => cat.trim().toLowerCase());
            const titleLower = post.title.toLowerCase();
            const taglineLower = post.tagline.toLowerCase();

            const termMatches = term =>
                catList.some(cat => cat.includes(term)) ||
                titleLower.includes(term) ||
                taglineLower.includes(term);

            if (searchTerms.length > 1) {
                return searchTerms.every(termMatches);
            }

            const singleTerm = searchTerms[0] || "";
            return termMatches(singleTerm);
        });

        displayPosts(filteredPosts);
    });

    // If we arrived with ?q=..., fill the search bar and run the search
    const incomingQuery = new URLSearchParams(window.location.search).get("q");
    if (incomingQuery) {
        searchBar.value = incomingQuery;
        searchBar.dispatchEvent(new Event("input"));
    }
};
</script>
