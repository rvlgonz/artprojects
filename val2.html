<script>


document.addEventListener("DOMContentLoaded", async () => {

    try {
        const response = await fetch("/.netlify/functions/get-vals");

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

    } catch (err) {
        console.error("Failed to load cards:", err);
    }
});

function randomColor() {
    const hue = Math.floor(Math.random() * 360);
    return `hsl(${hue}, 60%, 55%)`;
}

    function buildValsCarousel(vals) {
    const container = document.getElementById("valsCarousel");
    container.innerHTML = "";

    vals.forEach(val => {
        const slide = document.createElement("div");
        slide.className = "val-slide";
        slide.style.backgroundColor = randomColor();

        const nameEl = document.createElement("div");
        nameEl.className = "val-name";
        nameEl.textContent = val.name;

        const yearEl = document.createElement("div");
        yearEl.className = "val-year";
        yearEl.textContent = val.year;

        const messageEl = document.createElement("div");
        messageEl.className = "val-message";
        messageEl.textContent = val.message;

        slide.appendChild(nameEl);
        slide.appendChild(yearEl);
        slide.appendChild(messageEl);
        container.appendChild(slide);
    });
}


</script>
