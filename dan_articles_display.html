<script>

let dansArticles = [];

const gridContainer = document.getElementById("featuredGrid");
const searchBar = document.getElementById("searchBar");
//const date = new Date(post.created_at);

function displayPosts(postsToRender) {
    gridContainer.innerHTML = "";

    if (postsToRender.length === 0) {
        gridContainer.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #6c757d;">No matching entries found.</p>`;
        return;
    }

    postsToRender.forEach(post => {
    const cardElement = document.createElement("article");
    cardElement.classList.add("card");

    const catList = post.cat.split(/[,;|]/).map(cat => cat.trim()).filter(Boolean);
    const catTags = `<div class="cat-row">${catList.map(cat => `<span class="cat">${cat}</span>`).join('')}</div>`;

    cardElement.innerHTML = `
        <div class="card-content">
            ${catTags}
            <h2>${post.title}</h2>
            <div class="meta-date">${new Date(post.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
            <p>${post.tagline}</p>
            <a href="dans_articles.html?slug=${encodeURIComponent(post.slug)}" class="read-more">Read Full Article &rarr;</a>
        </div>
    `;
    gridContainer.appendChild(cardElement);
});
}

document.addEventListener("DOMContentLoaded", async () => {

    try {
        const response = await fetch("/.netlify/functions/get-articles");

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        dansArticles = data["dans_articles"];

    } catch (err) {
        console.error("Failed to load articles, using placeholder:", err);

        dansArticles = [
            {
                title: "The Climate of Policy",
                created_at: "August 12, 2026",
                cat: "policy",
                tagline: "Tell them some ideas",
                link: "#"
            },
            {
                title: "Thoughts on the fuel crisis",
                created_at: "July 28, 2026",
                cat: "commentary",
                tagline: "maybe we shouldn't be in iran",
                link: "#"
            },
            {
                title: "ideas for the future",
                created_at: "June 15, 2026",
                cat: "policy",
                tagline: "be more like dan",
                link: "#"
            }
        ];
    }

    // this now runs after we know which data source we're using
    displayPosts(dansArticles);

searchBar.addEventListener("input", (e) => {
    const rawSearch = e.target.value.toLowerCase();

    const searchTerms = rawSearch.split(/[;,]/).map(term => term.trim()).filter(Boolean);

    const filteredPosts = dansArticles.filter(post => {
        const catList = post.cat.split(/[;,]/).map(cat => cat.trim().toLowerCase());
        const titleLower = post.title.toLowerCase();
        const taglineLower = post.tagline.toLowerCase();

        const termMatches = term =>
            catList.some(cat => cat.includes(term)) ||
            titleLower.includes(term) ||
            taglineLower.includes(term);

        if (searchTerms.length > 1) {
            // every comma/semicolon-separated term must match something
            // (a category, the title, or the tagline)
            return searchTerms.every(termMatches);
        }

        const singleTerm = searchTerms[0] || "";
        return termMatches(singleTerm);
    });

    displayPosts(filteredPosts);
});

});

</script>
