<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title id="pageTitle">Loading...</title>
    <link href="css/styles.css" rel="stylesheet" />
</head>
        <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.6;
    background-color: #f8f9fa;
    color: #212529;
}

/* Header Styles */
header {
    background-color: #ffffff;
    border-bottom: 1px solid #e9ecef;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-container {
    max-width: 100vw;
    margin-left: 5rem;
    padding: 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
}

.logo {
    font-size: 1.5rem;
    font-weight: 700;
    color: #1a1a1a;
}

.logo span {
    color: #0076ff;
}

#searchBar {
    padding: 0.6rem 1.2rem;
    border: 1px solid #ced4da;
    border-radius: 20px;
    width: 300px;
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.2s;
}

#searchBar:focus {
    border-color: #0076ff;
}

/* Layout Container */
.blog-container {
    max-width: 100vw;
    margin: 3rem;
    padding: 0 1.5rem;
}

/* CSS Grid for Blog Cards */
.posts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 2rem;
}

/* Blog Card Styles */
.card {
    background: #ffffff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
}

.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1);
}

.card-content {
    padding: 1.5rem;
    display: flex;
    flex-direction: column;
    flex-grow: 1;
}

.cat {
    align-self: flex-start;
    background-color: #e3f2fd;
    color: #0076ff;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    padding: 0.25rem 0.6rem;
    border-radius: 4px;
    margin-bottom: 0.75rem;
}

.card h2 {
    font-size: 1.3rem;
    margin-bottom: 0.5rem;
    color: #1a1a1a;
}

.meta-date {
    font-size: 0.8rem;
    color: #6c757d;
    margin-bottom: 1rem;
}

.card p {
    font-size: 0.95rem;
    color: #495057;
    margin-bottom: 1.5rem;
}

.read-more {
    margin-top: auto;
    color: #0076ff;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
}

.navbar {
    background-color: #0076ff !important;
   font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

.navbar .navbar-brand {
    margin: 2rem !important;
}

.resume-section .resume-section-content p {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
}

.article-nav {
    display: flex;
    justify-content: space-between;
    padding: 2rem 1.5rem;
    border-top: 1px solid #e9ecef;
    margin-top: 2rem;
}

.nav-prev, .nav-next {
    color: #0076ff;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.95rem;
}

.nav-prev:hover, .nav-next:hover {
    text-decoration: underline;
}

.nav-prev.disabled, .nav-next.disabled {
    visibility: hidden;
}

#articleBody {
    margin-left: 20px;
}

#articleNav {
    margin-left: 100px;
    margin-right: 100px;
}

#bio.resume-section {
  padding-top: .5rem !important;
  margin-bottom: 0rem !important;
}

        </style>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top" id="sideNav">
            <a class="navbar-brand js-scroll-trigger" href="#page-top">
                <span class="d-block d-lg-none"><img class="img-fluid img-nav rounded-circle mx-auto mb-0" src="assets/img/dan prof.jpg" alt="..." /></span>
                <span class="d-none d-lg-block"><img class="img-fluid img-profile rounded-circle mx-auto mb-2" src="assets/img/dan prof.jpg" alt="..." /></span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="index.html">HOME PAGE (currently goes to my homepage)</a></li>
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="dan_articles_display.html">articles</a></li>
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#bio">blog info</a></li>                   
                    <!--li class="nav-item"><a class="nav-link js-scroll-trigger" href="#interests">Interests</a></li>
                    <li class="nav-item"><a class="nav-link js-scroll-trigger" href="#awards">Awards</a></li-->
                </ul>
            </div>
                </nav>

    <div id="articleContent">
        <p>Loading article...</p>
    </div>
    <div id="articleNav"></div>

            <hr class="m-0" />
                <section class="resume-section" id="bio">
                <div class="resume-section-content">
                    <h3 class="mb-5">Blog info</h3>
                    <div class="row d-flex flex-column flex-md-row justify-content-between">
                    <p>Dan is a public policy expert currently serving in the MN state government in rules coordination. OTHER TEXT, etc. </p>
                    <p>Find him on LinkedIn: <a class="social-icon" href="https://www.linkedin.com/in/danielgonzalez06/"><i class="fab fa-linkedin" style="font-size: 24px"></i></a></p>    
                    <p>Or contact him via email: <a class="social-icon" href="mailto:danielallangonzalez@gmail.com"><i class="fab fa-google" style="font-size: 24px"></i></a></p>  
                </div>
            </section>

    <script>
document.addEventListener("DOMContentLoaded", async () => {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("slug");
    const container = document.getElementById("articleContent");
    const navContainer = document.getElementById("articleNav");

    if (!slug) {
        container.innerHTML = "<p>No article specified.</p>";
        return;
    }

    try {
        // fetch the single article for display
        const response = await fetch("/.netlify/functions/get-article?slug=" + encodeURIComponent(slug));
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const article = data.article;

        if (!article) {
            container.innerHTML = "<p>Article not found.</p>";
            return;
        }

        document.getElementById("pageTitle").textContent = article.title;

            container.innerHTML = `
                
<section id="danArticlesDisplayFULL">     
    <header>
        <div class="header-container">
            <h1 class="logo"><a href="dan_articles_display.html" style="text-decoration: none;">Dan's <span>Blog</span></a></h1>
        </div>
    </header>
                <hr class="m-0" />
                <section class="resume-section" id="articleBody">
                <div class="resume-section-content">
                <span class="cat">${article.cat}</span>
                <h1 style="padding: 20px">${article.title}</h1>
                <div class="meta-date">${new Date(article.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
                <div class="article-body">${article.article}</div>
                                    </div>
            </section>
            `;
        
            const listResponse = await fetch("/.netlify/functions/get-articles");
        if (!listResponse.ok) throw new Error(`HTTP ${listResponse.status}`);

        const listData = await listResponse.json();
        const allArticles = listData["dans_articles"];

        const currentIndex = allArticles.findIndex(a => a.slug === slug);

        const prevArticle = currentIndex > 0 ? allArticles[currentIndex - 1] : null;
        const nextArticle = currentIndex < allArticles.length - 1 ? allArticles[currentIndex + 1] : null;

        navContainer.innerHTML = `
            <div class="article-nav">
                ${prevArticle
                    ? `<a href="dans_articles.html?slug=${encodeURIComponent(prevArticle.slug)}" class="nav-prev">&larr; ${new Date(prevArticle.created_at).toLocaleDateString()}</a>`
                    : `<span class="nav-prev disabled"></span>`
                }
                ${nextArticle
                    ? `<a href="dans_articles.html?slug=${encodeURIComponent(nextArticle.slug)}" class="nav-next">${new Date(nextArticle.created_at).toLocaleDateString()} &rarr;</a>`
                    : `<span class="nav-next disabled"></span>`
                }
            </div>
        `;

    } catch (err) {
        console.error("Failed to load article:", err);
        container.innerHTML = "<p>Something went wrong loading this article.</p>";
    }
});
    </script>
</body>
</html>
