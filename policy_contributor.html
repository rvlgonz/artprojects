        <script>
        // Set your master form password here
        const CONFIG_PASSWORD = "Dan"; // Change this to your desired password

        /**
         * Gatekeeper authentication logic
         */
        function verifyPassword(event) {
            event.preventDefault(); // Stop standard form reloading
            
            const passwordInput = document.getElementById('gatePassword');
            const errorContainer = document.getElementById('gateError');
            const gateCard = document.getElementById('gateCard');
            const protectedCard = document.getElementById('protectedCard');

            if (passwordInput.value === CONFIG_PASSWORD) {
                // Hide gate and unhide the submission form
                errorContainer.style.display = 'none';
                gateCard.classList.add('hidden');
                protectedCard.classList.remove('hidden');
            } else {
                // Reveal error text and wipe faulty input field
                errorContainer.style.display = 'block';
                passwordInput.value = '';
                passwordInput.focus();
            }
        }

        /**
         * Submission logic once the form is unlocked

        function handleFormSubmit(event) {
            event.preventDefault();
            
            const name = document.getElementById('userName').value;
            const message = document.getElementById('userMessage').value;

            // Replace this alert with your external API fetch post requests
            alert(`Success! Data received:\nName: ${name}\nMessage: ${message}`);
            
            // Optional: reset fields after transmission
            document.getElementById('submissionForm').reset();
        }          */
    </script>

        <script>document.addEventListener("click", function (event) {
    const navbarCollapse = document.getElementById("navbarResponsive");
    const toggler = document.querySelector(".navbar-toggler, .navbar-toggler-bio");

    if (!navbarCollapse.classList.contains("show")) return; // menu isn't open, nothing to do

    const clickedInsideMenu = navbarCollapse.contains(event.target);
    const clickedToggler = toggler && toggler.contains(event.target);

    if (!clickedInsideMenu && !clickedToggler) {
        const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
        if (bsCollapse) {
            bsCollapse.hide();
        }
    }
});</script>
