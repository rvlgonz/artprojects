<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>document.addEventListener("click", function (event) {
    const navbarCollapse = document.getElementById("navbarResponsive");
    const toggler = document.querySelector(".navbar-toggler, .navbar-toggler-bio");

    if (!navbarCollapse.classList.contains("show")) return; // menu isn't open, nothing to do

    const clickedInsideMenu = navbarCollapse.contains(event.target);
    const clickedToggler = toggler && toggler.contains(event.target);

    if (!clickedInsideMenu && !clickedToggler) {
        const bsCollapse = bootstrap.Collapse.getInstance(navbarCollapse);
        if (bsCollapse) {
            bsCollapse.hide();
        }
    }
});</script>
